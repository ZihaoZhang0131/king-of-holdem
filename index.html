<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>德扑之王</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05040c; color: #e8eaf4;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  canvas { display: block; }
  button { font: inherit; font-size: 13px; color: #e8eaf4; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 7px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s; }
  button:hover { background: rgba(255,255,255,.12); }
  button[hidden] { display: none; }
  button.on { background: linear-gradient(135deg, rgba(150,110,255,.35), rgba(216,179,106,.22)); border-color: rgba(216,179,106,.55); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }

  /* ---------- 浮窗 ---------- */
  .win { --w: 290px; position: absolute; z-index: 20; width: var(--w); max-width: calc(100vw - 24px); display: flex; flex-direction: column;
    background: linear-gradient(160deg, rgba(34,24,66,.93), rgba(10,8,22,.95)); border: 1px solid rgba(216,179,106,.25);
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07); transition: box-shadow .2s; }
  /* 注意：盖在 WebGL 画布上的元素不要用 backdrop-filter —— Mac 上的 Chrome/Safari 会随画布刷新闪出黑色方块，背景改用更高的不透明度 */
  .win.dragging { box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(216,179,106,.5); user-select: none; }
  .win.min { width: auto; border-radius: 999px; }
  .win-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; cursor: grab; user-select: none; touch-action: none; }
  .win.dragging .win-head { cursor: grabbing; }
  .win.min .win-head { padding: 6px 6px 6px 12px; }
  .win-ico { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; flex: none; font-size: 13px;
    background: linear-gradient(135deg, rgba(246,220,156,.25), rgba(199,155,255,.18)); color: #f6dc9c; }
  .win-head > b { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #f2cf86; white-space: nowrap; }
  .win-sum { font-size: 12px; color: #d6d0f0; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .win:not(.min) .win-sum { display: none; }
  .win-extra { margin-left: auto; font-size: 11px; color: #a99fd0; letter-spacing: 1px; white-space: nowrap; }
  .win.min .win-extra { display: none; }
  .win-min, .win-mini { flex: none; width: 26px; height: 26px; padding: 0; justify-content: center; border-radius: 8px; font-size: 12px; line-height: 1; }
  .win-min { margin-left: auto; background: transparent; border-color: transparent; color: #a99fd0; }
  .win-extra + .win-min, .win.min .win-mini + .win-min { margin-left: 0; }
  .win-min::before { content: ''; width: 10px; height: 2px; border-radius: 1px; background: currentColor; }
  .win.min .win-min { border-radius: 50%; }
  .win.min .win-min::before { width: 8px; height: 8px; background: none; border: 2px solid currentColor; border-radius: 2px; box-sizing: border-box; }
  .win-min:hover { color: #fff; background: rgba(255,255,255,.1); }
  .win-mini { display: none; margin-left: auto; border-radius: 50%; }
  .win-mini svg { width: 10px; height: 10px; fill: currentColor; }
  .win.min .win-mini { display: flex; }
  .win-mini.go { background: linear-gradient(135deg, #f6dc9c, #c99a45); color: #2a1a00; border-color: transparent; }
  .win-body { padding: 0 14px 14px; overflow: auto; overscroll-behavior: contain; }
  .win.min .win-body { display: none !important; }
  .win h4 { margin: 14px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 2px; color: #a99fd0; display: flex; align-items: baseline; gap: 8px; }
  .win h4 small { font-size: 10.5px; font-weight: 400; letter-spacing: 0; color: #7d77a0; }
  .win h4:first-child { margin-top: 2px; }
  .hint { margin: 12px 0 0; font-size: 11px; color: #8a84aa; line-height: 1.7; }
  .win ::-webkit-scrollbar { width: 6px; } .win ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

  /* 通用控件：分段按钮、开关、字段、输入框 */
  .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 10px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.08); }
  .seg.wide { display: flex; } .seg.wide > button { flex: 1; justify-content: center; }
  .seg > button { padding: 5px 9px; border: 0; border-radius: 8px; background: transparent; font-size: 12px; color: #b9b3d8; justify-content: center; }
  .seg > button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .seg > button.on { background: linear-gradient(135deg, rgba(150,110,255,.45), rgba(216,179,106,.32)); color: #fff; box-shadow: inset 0 0 0 1px rgba(216,179,106,.45); }
  .seg > button:disabled { cursor: default; }
  .sw { position: relative; flex: none; width: 34px; height: 20px; cursor: pointer; }
  .sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.14); transition: background .2s; pointer-events: none; }
  .sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #d8d4ea; transition: transform .2s, background .2s; }
  .sw input:checked + i { background: linear-gradient(135deg, #9a6bff, #d8b36a); }
  .sw input:checked + i::after { transform: translateX(14px); background: #fff; }
  .sw input:focus-visible + i { outline: 2px solid #f2cf86; outline-offset: 2px; }
  .fd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
  .fd + .fd { border-top: 1px solid rgba(255,255,255,.05); }
  .fd.col { flex-direction: column; align-items: stretch; gap: 6px; }
  .fd-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fd-l > span { font-size: 12.5px; color: #e2def5; }
  .fd-l small { font-size: 10.5px; color: #827ca4; line-height: 1.4; }
  .fd-c { flex: none; display: flex; align-items: center; }
  .win input[type=text], .win input[type=number], .win textarea { font: inherit; font-size: 12.5px; color: #f0eefa; background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 6px 8px; outline: none; box-sizing: border-box; transition: border-color .15s; }
  .win input:focus, .win textarea:focus { border-color: rgba(216,179,106,.7); }
  .win input:disabled { opacity: .45; }
  .win textarea { width: 100%; resize: vertical; line-height: 1.5; min-height: 58px; }
  .num { display: inline-flex; align-items: center; gap: 6px; }
  .num input { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
  .num em { font-style: normal; font-size: 11px; color: #9a94b8; min-width: 14px; }
  .range { display: inline-flex; align-items: center; gap: 8px; }
  .range input { width: 110px; accent-color: #d8b36a; }
  .range output { min-width: 32px; text-align: right; font-size: 12px; color: #ffe2a0; font-variant-numeric: tabular-nums; }
  .win input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .win input[type=number]::-webkit-inner-spin-button, .win input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  button.primary { background: linear-gradient(135deg, #f6dc9c, #c99a45); color: #2a1a00; border-color: transparent; font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, #f6dc9c, #c99a45); }
  button.ghost { width: 100%; justify-content: center; margin-top: 10px; font-size: 12px; color: #a99fd0; background: transparent; }

  /* ---------- 筹码排行 ---------- */
  #lb-rows { --rh: 52px; position: relative; height: calc(var(--rh) * 6 - 6px); }
  .lb-row { --c: #888; position: absolute; left: 0; right: 0; top: calc(var(--i, 0) * var(--rh)); height: calc(var(--rh) - 6px);
    box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 8px; cursor: pointer;
    border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); border-left: 3px solid var(--c);
    transition: top .7s cubic-bezier(.3,1.25,.4,1), background .3s, box-shadow .3s, opacity .3s; }
  .lb-row:hover { background: rgba(255,255,255,.08); }
  .lb-row.active { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, transparent), rgba(255,255,255,.03));
    box-shadow: 0 0 0 1px var(--c), 0 0 20px color-mix(in srgb, var(--c) 45%, transparent); }
  .lb-row.winner { background: linear-gradient(90deg, rgba(255,200,90,.22), rgba(255,255,255,.03)); box-shadow: 0 0 0 1px #ffd36e, 0 0 20px rgba(255,200,90,.35); }
  .lb-row.folded { opacity: .5; }
  .lb-row.focused { border-color: rgba(216,179,106,.55); border-left-color: var(--c); }
  .lb-rank { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font: 800 12px/1 Arial, sans-serif; color: #cfc8ee; background: rgba(255,255,255,.08); }
  .lb-row[data-rank="1"] .lb-rank { background: linear-gradient(135deg, #ffe9a8, #d39b32); color: #3a2600; box-shadow: 0 0 10px rgba(255,200,90,.55); }
  .lb-row[data-rank="2"] .lb-rank { background: linear-gradient(135deg, #f4f6fb, #9fa7ba); color: #23252e; }
  .lb-row[data-rank="3"] .lb-rank { background: linear-gradient(135deg, #f3c39a, #a8622f); color: #2e1606; }
  .lb-main { flex: 1; min-width: 0; }
  .lb-l1 { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .lb-l1 b { font-weight: 700; white-space: nowrap; }
  .lb-chips { margin-left: auto; font: 800 14px/1 "Helvetica Neue", Arial, sans-serif; color: #ffe2a0; font-variant-numeric: tabular-nums; }
  .lb-tag:empty { display: none; }
  .lb-tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.1); color: #cfc8ee; white-space: nowrap; }
  .lb-tag[data-type="active"] { background: var(--c); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  .lb-tag[data-type="allin"] { background: rgba(255,70,90,.35); color: #ffc0c8; }
  .lb-tag[data-type="win"] { background: linear-gradient(135deg, #ffe9a8, #d39b32); color: #3a2600; }
  .lb-l2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; }
  .lb-track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .lb-track i { display: block; height: 100%; border-radius: 2px; background: var(--c); transition: width .6s ease; }
  .lb-delta { min-width: 40px; text-align: right; color: #9a94b8; font-variant-numeric: tabular-nums; }
  .lb-delta[data-sign="1"] { color: #6be3a0; }
  .lb-delta[data-sign="-1"] { color: #ff8095; }
  .lb-mode:empty { display: none; }
  .lb-mode { font-size: 10.5px; color: #ffc4dc; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lb-wins:empty { display: none; }
  .lb-wins { color: #f2cf86; white-space: nowrap; }

  /* ---------- 视角设置 ---------- */
  #win-view { --w: 280px; }
  .focus-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .focus-grid button { --c: #888; min-width: 0; justify-content: flex-start; gap: 6px; padding: 6px 7px; font-size: 12px; border-radius: 9px; white-space: nowrap; overflow: hidden; }
  .focus-grid button .dot { background: var(--c); color: var(--c); width: 7px; height: 7px; }
  .focus-grid button.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, transparent); }

  /* ---------- 对局设置 ---------- */
  #win-match { --w: 340px; }
  #win-match .win-body { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .mp-ctrl { padding: 0 14px 12px; }
  .mp-status { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 22px; }
  .mp-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px;
    background: rgba(255,255,255,.08); color: #cfc8ee; white-space: nowrap; }
  .mp-pill i { width: 7px; height: 7px; border-radius: 50%; background: #8a84aa; }
  .mp-pill[data-s="running"] { background: rgba(80,200,140,.16); color: #a6f0c8; }
  .mp-pill[data-s="running"] i { background: #4fe39a; box-shadow: 0 0 8px #4fe39a; animation: pulse 1.4s ease-in-out infinite; }
  .mp-pill[data-s="paused"] { background: rgba(255,180,60,.16); color: #ffd08a; } .mp-pill[data-s="paused"] i { background: #ffb43c; }
  .mp-pill[data-s="finished"] { background: rgba(255,210,120,.18); color: #ffe2a0; } .mp-pill[data-s="finished"] i { background: #ffd36e; }
  .mp-info { font-size: 11.5px; color: #a99fd0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mp-primary { width: 100%; justify-content: center; padding: 11px; font-size: 14px; font-weight: 700; letter-spacing: 2px; border-radius: 12px; }
  .mp-primary.go { background: linear-gradient(135deg, #f6dc9c, #c99a45); color: #2a1a00; border-color: transparent; box-shadow: 0 6px 22px rgba(216,179,106,.3); }
  .mp-primary.go:hover { filter: brightness(1.08); }
  .mp-row { display: flex; gap: 8px; margin-top: 8px; }
  .mp-restart { flex: 1; justify-content: center; font-size: 12px; }
  .mp-speed { margin-left: auto; }
  .mp-tabs { display: flex; gap: 0; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .mp-tabs[hidden] { display: none; }
  .mp-tabs button { flex: 1; justify-content: center; border: 0; border-radius: 0; background: transparent; padding: 9px 0; font-size: 13px; color: #9a94b8;
    border-bottom: 2px solid transparent; margin-bottom: -1px; letter-spacing: 2px; }
  .mp-tabs button:hover { background: transparent; color: #fff; }
  .mp-tabs button.on { color: #f2cf86; border-bottom-color: #d8b36a; }
  .mp-scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 4px 14px 12px; }
  .mp-note { margin: 10px 0; font-size: 11.5px; line-height: 1.7; color: #a99fd0; }
  .mp-note b.ok { color: #4fe39a; } .mp-note b.warn { color: #ffb43c; }
  .mp-note code { color: #ffe2a0; }
  .mp-bulk { display: flex; gap: 6px; margin-bottom: 10px; }
  .mp-bulk input { flex: 1; min-width: 0; }
  .mp-bulk button { padding: 6px 12px; font-size: 12px; }
  .seat { --c: #888; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); border-left: 3px solid var(--c); margin-bottom: 6px; transition: opacity .2s; }
  .seat-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none; }
  .seat-head .dot { background: var(--c); color: var(--c); width: 8px; height: 8px; }
  .seat-head b { font-size: 13px; }
  .seat-sub { flex: 1; min-width: 0; font-size: 11px; color: #9a94b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .chev { font-style: normal; font-size: 11px; color: #7d77a0; transition: transform .2s; }
  .seat.open .chev { transform: rotate(180deg); }
  .seat-body { display: none; padding: 0 10px 10px; }
  .seat.open .seat-body { display: block; }
  .seat.off { opacity: .55; } .seat.off .seat-head b { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.35); }
  .seat-body .fd-c input[type=text] { width: 180px; }
  .chips-quick { display: flex; gap: 6px; margin: 2px 0 4px; }
  .chips-quick button { flex: 1; justify-content: center; padding: 5px 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  .chips-quick button.on { border-color: rgba(216,179,106,.6); color: #ffe2a0; }
  table.blinds { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 12px; }
  .blinds th { font-weight: 500; font-size: 11px; color: #827ca4; text-align: left; padding: 0 4px 4px; }
  .blinds td { padding: 2px 4px; color: #a99fd0; font-variant-numeric: tabular-nums; }
  .blinds td:first-child { width: 42px; }
  .blinds input { width: 100%; text-align: right; padding: 4px 6px !important; }
  .blinds .x { width: 24px; height: 24px; padding: 0; justify-content: center; background: transparent; border-color: transparent; color: #8a84aa; font-size: 15px; }
  .blinds .x:hover:not(:disabled) { color: #ff8095; background: rgba(255,80,100,.12); }
  .blinds .x:disabled { opacity: .25; cursor: default; }
  .add-level { width: 100%; justify-content: center; margin-top: 6px; font-size: 12px; border-style: dashed; color: #c9c0ef; }
  .mp-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.18); border-radius: 0 0 16px 16px; }
  .mp-foot[hidden] { display: none; }
  .mp-msg { flex: 1; font-size: 11.5px; color: #8a84aa; line-height: 1.4; }
  .mp-foot[data-k="dirty"] .mp-msg { color: #ffd08a; }
  .mp-foot[data-k="pending"] .mp-msg { color: #c9c0ef; }
  .mp-foot[data-k="err"] .mp-msg { color: #ff8095; }
  .mp-btns { display: flex; gap: 6px; }
  .mp-btns button { padding: 6px 10px; font-size: 12px; white-space: nowrap; }

  /* 视角设置里的显示开关 */
  body.no-eq .hud-eq, body.no-eq .hud-bar { display: none !important; }
  body.no-thought .hud-thought { display: none !important; }
  body.no-board #board-strip { display: none !important; }

  #banner { position: absolute; top: 16px; left: calc(50% + var(--side, 0px) / 2); transform: translateX(-50%); z-index: 9; text-align: center;
    pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .banner-row { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 14px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(34,24,66,.8), rgba(12,10,26,.75)); border: 1px solid rgba(216,179,106,.22);
    box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .brand { font: 900 15px/1 "PingFang SC", "Hiragino Sans GB", sans-serif; letter-spacing: 3px; padding-right: 2px; white-space: nowrap;
    background: linear-gradient(90deg, #f6dc9c, #d8b36a 50%, #c79bff); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgba(216,179,106,.35)); }
  #table-modes:empty { display: none; }
  #table-modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: min(92vw, 640px); }
  .mchip { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums;
    color: #fff; background: rgba(12,10,26,.78); border: 1px solid rgba(255,255,255,.15); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .mchip.sq { border-color: rgba(255,61,139,.55); color: #ffc4dc; }
  .mchip.sq.hot { background: linear-gradient(90deg, rgba(255,61,139,.35), rgba(12,10,26,.8)); color: #fff; }
  .mchip.br { border-color: rgba(63,169,255,.55); color: #bfe0ff; }
  .mchip.br.final { border-color: rgba(255,64,96,.7); color: #ffc0ca; background: linear-gradient(90deg, rgba(255,64,96,.3), rgba(12,10,26,.8)); }
  .mchip.br.warn { animation: pulse 1s ease-in-out infinite; }
  .live { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font: 800 11px/1.4 Arial; letter-spacing: 1.5px;
    color: #fff; background: rgba(255,60,100,.85); }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #table-info { font-size: 13px; color: #d6d0f0; white-space: nowrap; }
  #table-msg { font-size: 15px; font-weight: 700; color: #ffe2a0; padding: 8px 18px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(70,48,14,.82), rgba(30,20,8,.82)); border: 1px solid rgba(255,210,120,.45);
    box-shadow: 0 0 30px rgba(255,190,90,.25); animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }

  .hud { --c: #888; pointer-events: auto; cursor: pointer; min-width: 112px; padding: 6px 10px 7px; border-radius: 12px;
    background: linear-gradient(150deg, rgba(30,22,58,.92), rgba(9,8,20,.92)); border: 1px solid rgba(255,255,255,.1);
    box-shadow: inset 0 2px 0 var(--c), 0 6px 20px rgba(0,0,0,.35);
    white-space: nowrap; transition: opacity .3s, border-color .3s, box-shadow .3s; }
  .hud-top { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .hud-top .dot { background: var(--c); color: var(--c); }
  .hud-d { display: none; margin-left: auto; width: 16px; height: 16px; border-radius: 50%; background: #f7f5ee; color: #1b1c24;
    font: 900 10px/16px Arial; text-align: center; }
  .hud.dealer .hud-d { display: inline-block; }

  /* 底部公共牌条（转播风格） */

    background: linear-gradient(135deg, color-mix(in srgb, var(--a) 34%, rgba(10,8,22,.92)), rgba(10,8,22,.9)); border: 1.5px solid var(--a);

  .tg.sq { background: rgba(255,61,139,.22); color: #ffb3d1; box-shadow: inset 0 0 0 1px rgba(255,61,139,.45); }
  .tg.bt { background: rgba(255,176,46,.18); color: #ffd58a; box-shadow: inset 0 0 0 1px rgba(255,176,46,.35); }
  .tg.kl { background: rgba(255,255,255,.08); color: #e6e2f5; }
  .hud.squid-hunt { border-style: dashed; border-color: rgba(255,61,139,.45); }

  @keyframes squid-last { 0%, 100% { box-shadow: 0 0 0 1px rgba(255,61,139,.6), 0 0 10px rgba(255,61,139,.25); } 50% { box-shadow: 0 0 0 1px #ff3d8b, 0 0 26px rgba(255,61,139,.7); } }
  .act-fx[data-type="squid"], .act-fx[data-type="pay"] { --a: #ff3d8b; }
  .act-fx[data-type="gain"] { --a: #ff7ab0; }
  .act-fx[data-type="kill"] { --a: #ffb02e; }
  .act-fx[data-type="airdrop"] { --a: #ffc04a; }
  .act-fx[data-type="squid"] i, .act-fx[data-type="pay"] i, .act-fx[data-type="airdrop"] i { background: rgba(255,255,255,.12); font-size: 14px; }
  .act-fx[data-type="pay"] span { color: #ff9ac2; }

  #fx-flash { --c: #ff3b5c; position: fixed; inset: 0; z-index: 1000; pointer-events: none; display: grid; place-items: start center; padding-top: 22vh; opacity: 0; }
  #fx-flash.on { animation: flash-bg 1.8s ease-out forwards; }
  #fx-flash::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255,40,80,.35) 85%, rgba(255,40,80,.55)); }
  #fx-flash div { display: flex; align-items: baseline; gap: 14px; padding: 10px 26px; border-radius: 16px; position: relative;
    background: linear-gradient(135deg, rgba(60,8,20,.85), rgba(20,6,12,.85)); border: 1.5px solid rgba(255,90,120,.7);
    box-shadow: 0 0 60px rgba(255,40,80,.5); }
  #fx-flash.on div { animation: flash-text 1.8s cubic-bezier(.2,1.2,.3,1) forwards; }
  #fx-flash b { font-size: 22px; color: var(--c); filter: brightness(1.4); }
  #fx-flash span { font: 900 40px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: 4px; color: #fff; text-shadow: 0 0 20px var(--k, #ff3b5c); }
  #fx-flash[data-kind="squid"] { --k: #ff3d8b; } #fx-flash[data-kind="zone"] { --k: #3fa9ff; } #fx-flash[data-kind="final"] { --k: #ff4060; } #fx-flash[data-kind="kill"] { --k: #ffb02e; }
  #fx-flash[data-kind]:not([data-kind="allin"])::before { background: radial-gradient(ellipse at center, transparent 50%, color-mix(in srgb, var(--k) 28%, transparent) 88%, color-mix(in srgb, var(--k) 45%, transparent)); }
  #fx-flash[data-kind]:not([data-kind="allin"]) div { background: linear-gradient(135deg, color-mix(in srgb, var(--k) 28%, #0c0816 72%), rgba(12,8,22,.88)); border-color: color-mix(in srgb, var(--k) 75%, transparent);
    box-shadow: 0 0 60px color-mix(in srgb, var(--k) 45%, transparent); }
  #fx-flash[data-kind="kill"]::before { background: none; }
  #fx-flash[data-kind="kill"] span { font-size: 30px; }
  #fx-flash em { font: 800 26px/1 "Helvetica Neue", Arial, sans-serif; font-style: normal; color: #ffe2a0; }
  @keyframes flash-bg { 0% { opacity: 0; } 8% { opacity: 1; } 65% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes flash-text { 0% { transform: scale(2.2); opacity: 0; } 12% { transform: scale(1); opacity: 1; } 75% { transform: scale(1); } 100% { transform: scale(.94); } }
  .bs-cards { display: flex; gap: 8px; perspective: 600px; }

    <div class="fd"><div class="fd-l"><span>环境氛围</span><small>很轻的背景底噪与和声</small></div><div class="fd-c"><label class="sw"><input type="checkbox" id="opt-ambient"><i></i></label></div></div>
    <p class="hint">左键旋转 · 右键平移 · 滚轮缩放<br>1–6 聚焦 · 0 荷官 · H 总览 · T 俯视 · M 静音 · 空格 开始/暂停</p>
    <button class="ghost" id="btn-reset-layout">重置浮窗布局</button>
  </div>
</section>
